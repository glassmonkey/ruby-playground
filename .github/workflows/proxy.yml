name: Gem proxy

# The Cloudflare Worker in proxy/ has its own release: end-to-end checks on
# every change, and a deploy from main followed by the same checks against
# production. Its unit tests also run in CI's `npm run check`.
on:
  push:
    branches: ["main"]
    paths: ["proxy/**", ".github/workflows/proxy.yml"]
  pull_request:
    paths: ["proxy/**", ".github/workflows/proxy.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            proxy/package-lock.json
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm ci --prefix proxy
      - run: npm --prefix proxy run test:fixtures
      # Replays recorded RubyGems HTTP cassettes through a local Wrangler Worker.
      - run: npm run proxy:e2e

  deploy:
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: gem-proxy
      url: https://gems.ruby-play.dev
    concurrency:
      group: gem-proxy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            proxy/package-lock.json
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm ci --prefix proxy
      - run: npm --prefix proxy run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run proxy:e2e
        env:
          GEM_PROXY_URL: https://gems.ruby-play.dev
          GEM_PROXY_ORIGIN: https://ruby-play.dev
