name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # Production and development each run the versioned WASM lesson matrix.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: node --version && npm --version
      - run: npm ci
      - run: npm ci --prefix proxy
      - run: npm --prefix proxy run test:fixtures
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: false
      - run: npm run lsp:build
      - run: npm run lsp:verify
      - run: npm run test:e2e
      - run: npm run test:e2e:dev
