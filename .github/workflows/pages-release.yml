name: Pages release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the reviewed artifact after environment approval
        required: true
        type: boolean
        default: false
      release_stage:
        description: Build the staging preview or the production site
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      expected_current_sha:
        description: Full currently deployed production SHA (required after first production)
        required: false
        type: string
        default: ""
      first_production:
        description: Confirm this site has never had a production deployment
        required: true
        type: boolean
        default: false
      source_sha:
        description: Optional full commit SHA reachable from main (also used for rollback)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      release_stage: ${{ steps.release.outputs.stage }}
      base_path: ${{ steps.release.outputs.base_path }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preserve release tooling from the reviewed workflow revision
        run: |
          mkdir -p "$RUNNER_TEMP/pages-tooling"
          cp scripts/pages-assets*.mjs "$RUNNER_TEMP/pages-tooling/"
      - name: Select and verify release source
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
          RELEASE_STAGE: ${{ inputs.release_stage }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STAGE" != "preview" && "$RELEASE_STAGE" != "production" ]]; then
            echo "release_stage must be preview or production" >&2
            exit 1
          fi
          source_sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          if [[ ! "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          source_sha="${source_sha,,}"
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "source_sha must be reachable from main" >&2
            exit 1
          fi
          git checkout --detach "$source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Select release path
        id: release
        env:
          RELEASE_STAGE: ${{ inputs.release_stage }}
        run: |
          set -euo pipefail
          case "$RELEASE_STAGE" in
            preview) base_path="/ruby-playground/staging/" ;;
            production) base_path="/ruby-playground/" ;;
            *) echo "Unsupported release_stage: $RELEASE_STAGE" >&2; exit 1 ;;
          esac
          echo "stage=$RELEASE_STAGE" >> "$GITHUB_OUTPUT"
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: node --version && npm --version
      - name: Test asset-retention safety gates
        run: node --test "$RUNNER_TEMP/pages-tooling/pages-assets.test.mjs"
      - name: Pin the current production baseline and block unsafe preview
        id: baseline
        env:
          EXPECTED_CURRENT_SHA: ${{ inputs.expected_current_sha }}
          FIRST_PRODUCTION: ${{ inputs.first_production }}
          RELEASE_STAGE: ${{ steps.release.outputs.stage }}
        run: node "$RUNNER_TEMP/pages-tooling/pages-assets.mjs" inspect "$RUNNER_TEMP/pages-evidence/baseline.json"
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Run E2E at the repository root
        env:
          VITE_BASE_PATH: /
        run: npm run test:e2e
      - name: Run E2E at the selected Pages path
        env:
          VITE_BASE_PATH: ${{ steps.release.outputs.base_path }}
        run: npm run test:e2e
      - name: Build and package Pages artifact
        env:
          VITE_BASE_PATH: ${{ steps.release.outputs.base_path }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_STAGE: ${{ steps.release.outputs.stage }}
          BASE_PATH: ${{ steps.release.outputs.base_path }}
        run: |
          set -euo pipefail
          npm run build
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdir, readFile, rename, mkdir, writeFile } from 'node:fs/promises';
          import path from 'node:path';

          const publicDir = path.resolve('public');
          const stage = process.env.RELEASE_STAGE;
          const sourceSha = process.env.SOURCE_SHA;
          const basePath = process.env.BASE_PATH;
          const expectedBasePath = stage === 'preview'
            ? '/ruby-playground/staging/'
            : '/ruby-playground/';
          if (basePath !== expectedBasePath) throw new Error(`Unexpected base path for ${stage}: ${basePath}`);

          async function filesBelow(directory, prefix = '') {
            const entries = await readdir(directory, { withFileTypes: true });
            const files = [];
            for (const entry of entries) {
              const relative = path.posix.join(prefix, entry.name);
              if (entry.isDirectory()) files.push(...await filesBelow(path.join(directory, entry.name), relative));
              else if (entry.isFile()) files.push(relative);
            }
            return files;
          }

          const wasmFiles = [];
          for (const relative of await filesBelow(publicDir)) {
            if (!relative.endsWith('.wasm')) continue;
            const bytes = await readFile(path.join(publicDir, relative));
            wasmFiles.push({
              url: `${basePath}${relative}`,
              bytes: bytes.byteLength,
              sha256: createHash('sha256').update(bytes).digest('hex'),
            });
          }
          if (wasmFiles.length === 0) throw new Error('The built artifact contains no WASM files');

          const indexPath = path.join(publicDir, 'index.html');
          let html = await readFile(indexPath, 'utf8');
          if (!/<head(?:\s[^>]*)?>/i.test(html)) throw new Error('Built index.html has no head element');
          html = html.replace(/<meta\s+name=["']release-source["'][^>]*>/gi, '');
          const releaseMeta = `<meta name="release-source" content="${sourceSha}"><meta name="release-stage" content="${stage}">`;
          if (stage === 'preview') {
            // Keep app-owned share-state metadata separate from this durable preview marker.
            html = html.replace(/<head(?:\s[^>]*)?>/i, (head) => `${head}<meta name="robots" content="noindex,nofollow" data-pages-preview-noindex>${releaseMeta}`);
          } else {
            html = html.replace(/<head(?:\s[^>]*)?>/i, (head) => `${head}${releaseMeta}`);
          }
          await writeFile(indexPath, html);

          const releaseInfo = {
            source_sha: sourceSha,
            base_path: basePath,
            stage,
            wasm: wasmFiles,
          };
          await writeFile(path.join(publicDir, 'release-info.json'), `${JSON.stringify(releaseInfo, null, 2)}\n`);

          if (stage === 'preview') {
            const appDir = `${publicDir}-app`;
            await rename(publicDir, appDir);
            await mkdir(publicDir);
            await rename(appDir, path.join(publicDir, 'staging'));
            await writeFile(path.join(publicDir, 'index.html'), `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow" data-pages-preview-noindex><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview is being prepared</title></head><body><main><h1>Preview is being prepared</h1><p>The preview is available under <a href="/ruby-playground/staging/">the staging path</a>.</p></main></body></html>\n`);
          }

          console.log(JSON.stringify({ source_sha: sourceSha, stage, base_path: basePath, wasm: wasmFiles }, null, 2));
          NODE
          printf '%s\n' '### GitHub Pages artifact' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Stage: $RELEASE_STAGE" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Base path: $BASE_PATH" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Preview app path: public/staging/ (preview only)' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Artifact directory: public/' >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild the pinned previous production source
        if: steps.baseline.outputs.baseline_sha != ''
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.baseline_sha }}
          VITE_BASE_PATH: /ruby-playground/
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$BASELINE_SHA" origin/main; then
            echo "The production baseline must be reachable from main" >&2
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/pages-baseline" "$BASELINE_SHA"
          cd "$RUNNER_TEMP/pages-baseline"
          npm ci
          npm run build
      - name: Preserve verified production assets and their source/hash manifest
        if: steps.release.outputs.stage == 'production'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BASELINE_SHA: ${{ steps.baseline.outputs.baseline_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASELINE_SHA" ]]; then
            export BASELINE_DIR="$RUNNER_TEMP/pages-baseline"
          fi
          node "$RUNNER_TEMP/pages-tooling/pages-assets.mjs" retain "$RUNNER_TEMP/pages-evidence/baseline.json"
          cp public/asset-retention.json public/release-info.json "$RUNNER_TEMP/pages-evidence/"
          printf '%s\n' "- Previous production SHA: ${BASELINE_SHA:-none (confirmed first production)}" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Generated assets retained with verified SHA-256 and source provenance: asset-retention.json' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production has not changed during the build
        run: node "$RUNNER_TEMP/pages-tooling/pages-assets.mjs" verify "$RUNNER_TEMP/pages-evidence/baseline.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-retention-evidence
          path: ${{ runner.temp }}/pages-evidence/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public/
          retention-days: 7

  deploy:
    if: inputs.publish == true && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: pages-retention-evidence
          path: ${{ runner.temp }}/pages-evidence
      - name: Recheck pinned production after approval, immediately before deployment
        run: node scripts/pages-assets.mjs verify "$RUNNER_TEMP/pages-evidence/baseline.json"
      - name: Deploy approved Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  deployed-smoke:
    if: inputs.publish == true && github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Preserve reviewed retention tooling
        run: |
          mkdir -p "$RUNNER_TEMP/pages-tooling"
          cp scripts/pages-assets.mjs "$RUNNER_TEMP/pages-tooling/"
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify hosted production manifest and every retained asset
        if: needs.build.outputs.release_stage == 'production'
        env:
          EXPECTED_CURRENT_SHA: ${{ needs.build.outputs.source_sha }}
        run: node "$RUNNER_TEMP/pages-tooling/pages-assets.mjs" hosted "$RUNNER_TEMP/hosted-assets.json"
      - name: Run deployed browser smoke once, without retries
        env:
          PLAYWRIGHT_BASE_URL: https://glassmonkey.github.io${{ needs.build.outputs.base_path }}
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          DEPLOYMENT_STAGE: ${{ needs.build.outputs.release_stage }}
        run: npx playwright test --config=playwright.deployed.config.ts --reporter=line,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-deployed-smoke
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/hosted-assets.json
          if-no-files-found: warn
          retention-days: 14
