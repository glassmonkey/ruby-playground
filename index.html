    />
    <meta property="og:url" content="https://ruby-play.dev/" />
    <meta name="twitter:card" content="summary" />

  <body>
    <div id="root">
      <main id="static-description">
        <h1>ブラウザで Ruby を試す</h1>
        <p>
          Ruby Playground は Ruby 4.0・3.4・3.3
          のコードをブラウザで書いて実行する playground です。 たとえば
          <code>Hello Ruby!</code>
          のメッセージから、再帰でフラクタルを描くサンプルを試せます。
        </p>
        <p>
          編集後や共有リンクを開いた際に自動実行されます。信頼できないリンクを開かず、秘密情報は入力しないでください。
        </p>
        <p>
          実行には JavaScript と Ruby WebAssembly
          を読み込みます。標準入力、追加gem、永続保存には対応しません。
          1回の実行は20秒、出力は100 KB、コードは50,000文字までです。
        </p>
      </main>
    </div>
    <script type="module" src="./src/index.tsx"></script>
  </body>
